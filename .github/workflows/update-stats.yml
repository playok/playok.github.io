name: update stats

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파싱 로직 테스트
        run: python3 -m unittest discover -s scripts -v

      - name: 기여 통계 수집
        run: python3 scripts/build_stats.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- assets/stats.json; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          git commit -m "chore: 기여 통계 갱신"
          git push
